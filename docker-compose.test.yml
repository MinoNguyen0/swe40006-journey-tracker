
# Isolated MySQL database for automated integration tests

services:
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: journeytracker_test
      MYSQL_USER: journey_test
      MYSQL_PASSWORD: journey_test_pw
      MYSQL_ROOT_PASSWORD: root_test_pw

    ports:
      - "127.0.0.1:13308:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s