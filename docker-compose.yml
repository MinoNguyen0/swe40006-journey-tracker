# local mysql for dev (port 3307 because xampp uses 3306)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: journeytracker
      MYSQL_USER: journey
      MYSQL_PASSWORD: journey_dev_pw
      MYSQL_ROOT_PASSWORD: root_dev_pw
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
