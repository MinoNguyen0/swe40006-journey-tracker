# local mysql for dev (port 3307 because xampp uses 3306)

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: journeytracker
      MYSQL_USER: journey
      MYSQL_PASSWORD: journey_dev_pw
      MYSQL_ROOT_PASSWORD: root_dev_pw
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: journeytracker:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=db;Port=3306;Database=journeytracker;User=journey;Password=journey_dev_pw;"
      COMMIT_SHA: docker-local
    ports:
      - "8080:8080"

volumes:
  db-data:

