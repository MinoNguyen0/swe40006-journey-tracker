
name: Journey Tracker CI

# Run CI when code is pushed or a pull request is opened
on:
  push:
    branches:
      - develop
      - main
      - feature/ci-pipeline

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore JourneyTracker.slnx

      # Step 4: Build the solution
      - name: Build solution
        run: dotnet build JourneyTracker.slnx --configuration Release --no-restore

      # Step 5: Run existing xUnit tests
      - name: Run unit tests
        run: dotnet test tests/JourneyTracker.UnitTests/JourneyTracker.UnitTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=unit-tests.trx"

      # Step 6: Save unit test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  # Publish a Docker image only after the tests pass
  publish-image:
    name: Build and Publish Docker Image
    needs: [build-and-test, integration-tests, e2e-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}:${{ github.sha }}

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Prepare lowercase GHCR image name
      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Step 4: Authenticate to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Build and publish the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  integration-tests:
    name: MySQL Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: journeytracker_test
          MYSQL_USER: journey_test
          MYSQL_PASSWORD: journey_test_pw
          MYSQL_ROOT_PASSWORD: root_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_test_pw --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      JOURNEYTRACKER_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=journeytracker_test;User=journey_test;Password=journey_test_pw;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run MySQL integration tests
        run: dotnet test tests/JourneyTracker.IntegrationTests/JourneyTracker.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/JourneyTracker.IntegrationTests/TestResults/*.trx
          if-no-files-found: warn
  # Playwright browser tests using an isolated MySQL database
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Build the E2E test project
      - name: Build Playwright tests
        run: dotnet build tests/JourneyTracker.E2ETests/JourneyTracker.E2ETests.csproj --configuration Release

      # Step 4: Install Chromium browser and dependencies
      - name: Install Playwright Chromium
        run: pwsh tests/JourneyTracker.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Step 5: Start isolated application and MySQL
      - name: Start E2E Docker environment
        run: |
          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml \
            up -d --build --wait --wait-timeout 180

      # Step 6: Wait for application readiness
      - name: Verify application health
        run: |
          echo "Checking E2E container status..."
          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml ps -a

          echo "Waiting for Journey Tracker..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:18080/health; then
              echo ""
              echo "Application health check passed!"
              exit 0
            fi

            echo "Application not ready ($attempt/30)"
            sleep 3
          done

          echo "Application health check failed."

          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml ps -a

          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml \
            logs --no-color --tail=100 app-e2e

          exit 1

      # Step 7: Execute all three Playwright tests
      - name: Run Playwright E2E tests
        env:
          JOURNEYTRACKER_BASE_URL: http://127.0.0.1:18080
        run: |
          dotnet test tests/JourneyTracker.E2ETests/JourneyTracker.E2ETests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=e2e-tests.trx"

      # Step 8: Save Docker diagnostics
      - name: Capture E2E Docker logs
        if: always()
        run: |
          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml \
            ps -a > e2e-containers.txt

          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml \
            logs --no-color --timestamps > e2e-compose.log

      # Step 9: Upload test results and logs
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            tests/JourneyTracker.E2ETests/TestResults/*.trx
            e2e-compose.log
          if-no-files-found: warn

      # Step 10: Remove temporary test containers and data
      - name: Clean up E2E environment
        if: always()
        run: |
          docker compose -p journeytracker-e2e \
            -f docker-compose.e2e.yml \
            down -v --remove-orphans

  deploy-staging:
    name: Deploy to Staging
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{sub, aud, repository, ref, environment}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: ./deploy/ssm-deploy.sh staging "${{ needs.publish-image.outputs.image }}" "${{ github.sha }}" "${{ vars.INSTANCE_ID }}"

  deploy-production:
    name: Deploy to Production
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: ./deploy/ssm-deploy.sh production "${{ needs.publish-image.outputs.image }}" "${{ github.sha }}" "${{ vars.INSTANCE_ID }}"