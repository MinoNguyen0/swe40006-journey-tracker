name: Deploy production
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::324081753724:role/github-deploy-production
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Environment,Values=production" \
            --parameters 'commands=["cd /opt/app && ./deploy.sh"]' \
            --comment "deploy ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          # send-command returns immediately, so wait for the result
          sleep 5
          for ID in $(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query "CommandInvocations[].InstanceId" --output text); do
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID"
          done
